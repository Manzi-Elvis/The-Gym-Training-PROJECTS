<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Smart Form Validation</title>
      <link rel="stylesheet" href="styles.css">
</head>
<body>
      <main class="page">
            <form class="form-card" id="signupForm">
                  <h1>Create Account</h1>
                  <p>Build your future. Start with clean validation</p>
                  <div class="field">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder = "Manzi Elvis">
                        <small class="error"></small>
                  </div>

                  <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder = "me@gmail.com">
                        <small class="error"></small>
                  </div>

                  <div class="field">
                        <label for="password">Password</label>
                        <div class = "password-box">
                              <input type="password" id="password" placeholder = "Create a strong password">
                              <button type="button" id="togglePassword">Show</button>
                        </div>
                        <div class="strength">
                              <span></span>
                        </div>
                        <small class="error"></small>
                  </div>
                  <div class="field">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Repeat password">
                        <small class="error"></small>
                  </div>

                  <label class="terms">
                        <input type="checkbox" id = "terms">
                        <span>I agree to the terms and conditions</span>
                  </label>
                  <small class="error terms-error"></small>

                  <button type="submit" class="submit-btn">Create Account</button>

                  <p id="successMessage"></p>
            </form>
      </main>
      <script src="script.js"></script>
</body>
</html>
