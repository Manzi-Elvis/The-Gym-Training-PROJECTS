<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Navbar</title>
      <style>
            * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #050816;
  color: white;
  min-height: 100vh;
}

/* NAVBAR */
.navbar {
  width: 90%;
  max-width: 1200px;
  margin: 30px auto;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 18px 28px;
  border-radius: 18px;

  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
}

/* LOGO */
.logo {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: 2px;
  color: #38bdf8;
}

/* LINKS CONTAINER */
.nav-links {
  display: flex;
  gap: 32px;
  list-style: none;
}

/* LINKS */
.nav-links a {
  text-decoration: none;
  color: #e5e7eb;
  font-size: 0.95rem;
  transition: 0.3s;
}

.nav-links a:hover {
  color: #38bdf8;
}

/* BUTTON */
.nav-btn {
  text-decoration: none;
  color: white;
  background: linear-gradient(135deg, #2563eb, #06b6d4);
  padding: 12px 20px;
  border-radius: 999px;
  font-weight: 700;
  transition: 0.3s;
}

.nav-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(56, 189, 248, 0.35);
}

/* RESPONSIVE DESIGN */
@media (max-width: 768px) {
  .navbar {
    flex-direction: column;
    gap: 22px;
  }

  .nav-links {
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
}
      </style>
</head>
<body>
     <nav class="navbar">
      <div class="logo">MRE</div>
      <ul class="nav-links">
            <li>Home</li>
            <li>About</li>
            <li>Projects</li>
            <li>Blog</li>
            <li>Contact</li>
      </ul>
      <a href="#" class="nav-btn">Hire Me</a>
     </nav> 
</body>
</html>
