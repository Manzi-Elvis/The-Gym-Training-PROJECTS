<!DOCTYPE html>
<html lang="en">
<head>
  <style>

    body{
      margin:0;
      font-family:Arial;
    }

    .container{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:20px;

      padding:20px;
      background:#222;
    }

    .box{
      width:150px;
      height:150px;
      background:steelblue;
      color:white;

      display:flex;
      justify-content:center;
      align-items:center;

      font-size:24px;
      border-radius:10px;
    }

  </style>
</head>
<body>

  <div class="container">

    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>

  </div>

</body>
</html>
